    <path id="glyph-U" d="M 0 0 V 62 A 38 38 0 0 0 38 100 H 70 A 38 38 0 0 0 108 62 V 0"/>
    <path id="glyph-K" d="M 0 0 V 100 M 124 -26.27 L 14 54 L 124 122.38"/>
    <path id="glyph-T" d="M 0 0 H 104 M 52.0 0 V 100"/>
    <path id="glyph-I" d="M 0 0 V 100"/>
    <path id="glyph-N" d="M 0 100 V 0 L 108 100 V 0"/>
    <path id="glyph-M" d="M 0 100 V 0 L 68.0 100 L 136 0 V 100"/>
    <path id="glyph-A" d="M -23.2 140 L 52.0 0 L 127.2 140"/>
    <path id="glyph-A-swoosh-bold" d="M -4 82 Q 48 64 112 28 Q 48 100 -4 82 Z"/>
    <path id="glyph-A-swoosh-light" d="M -4 82 Q 48 71.5 112 28 Q 48 92.5 -4 82 Z"/>

    <!-- Trim lines: cut diagonal stroke ends flat at cap height / baseline -->
    <clipPath id="band-bold"><rect x="-200" y="-12" width="600" height="124"/></clipPath>
    <clipPath id="base-bold"><rect x="-200" y="-200" width="600" height="299.49"/></clipPath>
    <clipPath id="band-light"><rect x="-200" y="-7" width="600" height="114"/></clipPath>
    <clipPath id="base-light"><rect x="-200" y="-200" width="600" height="300.33"/></clipPath>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="200" fill="#0E1B2B"/>

  <!-- Artwork -->
  <g>
    <!-- Monogram: the brand C and A -->
    <g transform="translate(222.31 396.37) scale(2.31)">
      <use xlink:href="#glyph-C" stroke="#EEE9E3" fill="none" stroke-width="24" stroke-linecap="square" stroke-linejoin="miter" stroke-miterlimit="12"/>
    </g>
    <g transform="translate(558.25 396.37) scale(2.31)">
