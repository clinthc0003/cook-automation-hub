<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cook Automation</title>
    <meta
      name="description"
      content="Cook Automation is a focused home for the tools we run."
    />
    <meta name="theme-color" content="#0E1B2B" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    />

    <!-- Manifest, icons, and styles -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="stylesheet" href="/styles.css?v=3" />
  </head>
  <body>
    <!-- Header -->
    <header class="site-header">
      <div class="header-inner">
        <a
          class="brand"
          id="brand-home"
          href="#/"
          aria-label="Cook Automation home"
        >
          <!--
            CA monogram from /brand/monogram-cream.svg.
            Same viewBox, paths, stroke, mask, and clip. Drawn once on load.
          -->
          <svg
            class="brand-mark"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="190 364 644 296"
            width="37"
            height="17"
            role="img"
            aria-label="Cook Automation"
            focusable="false"
          >
            <title>Cook Automation</title>

            <defs>
              <!-- Swoosh ribbon. The mask uses it to clear a gap through the A. -->
              <path id="brand-swoosh" d="M -4 82 Q 48 64 112 28 Q 48 100 -4 82 Z"/>

              <!-- Flat baseline cut, copied from the monogram file. -->
              <clipPath id="brand-base-bold">
                <rect x="-200" y="-200" width="600" height="299.49"/>
              </clipPath>

              <!-- Transparent gap where the swoosh will sit. -->
              <mask id="brand-swoosh-gap" maskUnits="userSpaceOnUse" x="-120" y="-120" width="400" height="400">
                <rect x="-120" y="-120" width="400" height="400" fill="#FFFFFF"/>
                <use href="#brand-swoosh" fill="#000000" stroke="#000000" stroke-width="14.4" stroke-linejoin="round"/>
              </mask>

              <!--
                Blade anchored at the swoosh tail. Its width grows along the
                ribbon, lower-left toward the upper-right tip.
              -->
              <clipPath id="brand-swoosh-wipe" clipPathUnits="userSpaceOnUse">
                <rect
                  class="logo-swoosh-blade"
                  x="0"
                  y="-42"
                  width="136"
                  height="84"
                  transform="translate(-4 82) rotate(-25)"
                />
              </clipPath>
            </defs>

            <!-- Artwork -->
            <g>
              <!-- C -->
              <g transform="translate(222.31 396.37) scale(2.31)">
                <path
                  class="logo-pen logo-c"
                  d="M 112 0 H 38 A 38 38 0 0 0 0 38 V 62 A 38 38 0 0 0 38 100 H 112"
                  pathLength="100"
                  fill="none"
                  stroke="#EEE9E3"
                  stroke-width="24"
                  stroke-linecap="square"
                  stroke-linejoin="miter"
                  stroke-miterlimit="12"
                />
              </g>

              <!-- A, then the swoosh that slices through it -->
              <g transform="translate(558.25 396.37) scale(2.31)">
                <g mask="url(#brand-swoosh-gap)">
                  <g transform="translate(0 12.51)" clip-path="url(#brand-base-bold)">
                    <path
                      class="logo-pen logo-a"
                      d="M -23.2 140 L 52.0 0 L 127.2 140"
                      pathLength="100"
                      fill="none"
                      stroke="#EEE9E3"
                      stroke-width="24"
                      stroke-linecap="square"
                      stroke-linejoin="miter"
                      stroke-miterlimit="12"
                    />
                  </g>
                </g>
                <g class="logo-swoosh" clip-path="url(#brand-swoosh-wipe)">
                  <use href="#brand-swoosh" fill="#EEE9E3"/>
                </g>
              </g>
            </g>
          </svg>
        </a>

        <nav class="site-nav" aria-label="Primary">
          <a href="#/" id="nav-home" data-nav="home">Home</a>
          <a href="#/apps" id="nav-apps" data-nav="apps">Apps</a>
          <a href="#/contact" id="nav-contact" data-nav="contact">Contact</a>
        </nav>
      </div>
    </header>

    <!-- Views are swapped by app.js. This copy is the initial / no-JS home page. -->
    <main id="view">
      <section class="hero">
        <img
          class="hero-watermark"
          src="/brand/monogram-cream.svg"
          alt=""
          aria-hidden="true"
        />
        <div class="hero-inner">
          <img
            class="hero-lockup"
            src="/brand/lockup-est2019-cream.svg"
            alt="Cook Automation, Est. 2019"
          />
          <div class="hero-rule" aria-hidden="true"></div>
          <h1 class="hero-title">A focused home for the tools we run.</h1>
          <p class="hero-lead">
            Explore what we build, read a quick overview of each app, and launch
            any tool in its own browser tab.
          </p>
          <div class="hero-actions">
            <a class="button button-light" id="hero-browse-apps" href="#/apps">
              <span>Browse apps</span>
              <span class="arrow" aria-hidden="true">&#8594;</span>
            </a>
          </div>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
      <div class="footer-inner">
        <img
          class="footer-wordmark"
          src="/brand/horizontal-est2019-navy.svg"
          alt="Cook Automation, Est. 2019"
          height="14"
        />
        <nav class="footer-nav" aria-label="Footer">
          <a href="#/">Home</a>
          <span class="diamond" aria-hidden="true"></span>
          <a href="#/apps">Apps</a>
          <span class="diamond" aria-hidden="true"></span>
          <a href="#/contact">Contact</a>
        </nav>
      </div>
    </footer>

    <script src="/map-preview.js?v=2"></script>
    <script src="/app.js?v=3"></script>
  </body>
</html>
